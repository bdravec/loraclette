[project]
name = "loraclette"
version = "0.1.0"
description = "Teaching Apertus to resolve merge conflicts with a LoRA adapter"
requires-python = ">=3.10"
# Pins follow swiss-ai/apertus-finetuning-recipes requirements.txt.
# Dropped: deepspeed (multi-GPU only), kernels (only for FlashAttention 3).
# torch is installed separately for the machine's CUDA version.
# vLLM is NOT here: it pins its own torch, so serving uses a separate env.
dependencies = [
    "transformers>=4.55.0",
    "trl>=0.21.0",
    "peft>=0.17.0",
    "datasets",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loraclette"]
