# Based on swiss-ai/apertus-finetuning-recipes configs/sft_lora.yaml.
# Changes: Apertus v1.5 instead of v1 (UNVERIFIED with this recipe, see the v1.5
# compatibility issue), sdpa attention (FlashAttention 3 is Hopper-only), local dataset,
# batch 1 x grad-accum 4 (same effective batch of 4, fits smaller GPUs).

# Model
model_name_or_path: swiss-ai/Apertus-v1.5-8B
attn_implementation: sdpa
dtype: bfloat16

# Dataset: local folder with train.jsonl / test.jsonl in prompt-completion format,
# written by src/loraclette/data/build_dataset.py
# (paths are relative to track_2b/, the project root)
dataset_name: data/processed
dataset_num_proc: 12

# Hyperparameters
learning_rate: 2.0e-4
gradient_checkpointing: true
num_train_epochs: 1.0
logging_steps: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4

# LoRA / PEFT
use_peft: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: all-linear

# Seq length & scheduler
max_length: 4096
warmup_ratio: 0.03
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1

# Output & logging
output_dir: outputs/lora_r8_baseline
report_to: "none"
seed: 42
